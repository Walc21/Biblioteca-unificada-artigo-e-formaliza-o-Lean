name: Verificação

# Reconstrói o volume em LaTeX, a formalização Lean, o mapa TeX → Lean e a
# validação numérica a cada push e pull request. Não publica nem altera arquivos.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4 (compilação, auditorias de axiomas e mapa)
    runs-on: ubuntu-latest
    # Os três ambientes Lean ocupam cerca de 22 GB de .lake somados. Se o runner
    # padrão ficar sem espaço, dividir este job em uma matriz, um ambiente por job.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Instalar elan (gerenciador do Lean)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restaurar cache do Mathlib
        run: |
          for ambiente in artigo_2 base_integrada parte_1; do
            (cd "lean4/ambientes/$ambiente" && lake exe cache get)
          done

      - name: Compilar e auditar
        run: bash lean4/verificar.sh

      - name: Verificar o mapa TeX → Lean
        run: python3 mapas/verificar_mapa.py

  latex:
    name: LaTeX (volume)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar com -Werror
        working-directory: tex
        run: latexmk -pdf -Werror -interaction=nonstopmode -halt-on-error principal.tex

      - name: Guardar o PDF gerado
        uses: actions/upload-artifact@v4
        with:
          name: pdf-volume
          path: tex/principal.pdf

  fontes:
    name: Fontes derivadas e validação numérica (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir que documento_completo.tex está atualizado
        run: |
          python3 tex/gerar_fonte_unica.py
          git diff --exit-code -- tex/documento_completo.tex

      - name: Conferir que o mapa gerado está atualizado
        run: python3 mapas/gerar_mapa.py --verificar

      - name: Instalar dependências
        run: python -m pip install -r verificacao/requirements.txt

      - name: Reproduzir os resultados
        run: |
          python verificacao/reproduzir_tudo.py --output-root "$RUNNER_TEMP/verificacao"

      - name: Conferir as tabelas do volume
        run: python verificacao/conferir_tabelas.py --output-root "$RUNNER_TEMP/verificacao"

      - name: Guardar as saídas
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-saidas
          path: ${{ runner.temp }}/verificacao
