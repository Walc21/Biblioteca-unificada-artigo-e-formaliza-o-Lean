name = "biblioteca_lean_unificada"
version = "0.1.0"
defaultTargets = ["Unified"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "Unified"
globs = ["Unified", "Unified.+"]

[[lean_lib]]
name = "SemanticAudit"
globs = ["SemanticAudit"]

[[lean_lib]]
name = "RequestProject"
srcDir = "entradas/parte_1"
globs = ["RequestProject", "RequestProject.+"]
